# Trade signal scanner — entry / stop-loss / take-profit on your favourite pairs.
#   python signals.py scan        live scanner (checks every closed candle)
#   python signals.py once        one scan, print, exit
#   python signals.py backtest    test the rules on past data before trusting them
#   python signals.py status      open signals and track record

# MAIN pairs: every signal at min_score or above, with a normal (sound) notification.
# Signals use Binance USDT-perp prices; USDC pairs trade within cents, so levels apply to both.
pairs = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]

# LOW-PRIORITY pairs: need a stronger setup (watch_min_score) and arrive as SILENT notifications.
watch_pairs = []
watch_min_score = 75

entry_tf = "1h"            # timeframe signals are generated on: 15m, 30m, 1h, 2h, 4h
trend_tf = "4h"            # higher timeframe that must agree with the trade direction
scan_every_sec = 60        # how often to poll; signals fire only on CLOSED candles
data_source = "binance"    # "binance" (USDT-M futures) with automatic fallback to "bybit"

[rules]
min_score = 60             # 0-100; raise for fewer, higher-quality signals
setups = ["pullback", "breakout"]
sl_atr_min = 1.0           # stop distance clamped between these ATR multiples
sl_atr_max = 2.5
swing_lookback = 6         # bars used to place the stop beyond recent swing low/high
tp_r = [1.0, 2.0, 3.0]     # take-profit levels as multiples of risk (R)
breakout_lookback = 20
breakout_volume_mult = 1.5
max_bars_open = 48         # close a signal at market if no SL/TP after this many bars
cooldown_bars = 6          # after a signal closes, wait this long before re-signalling that pair

[risk]
# These can also be changed from your phone: /capital /risk /lev  (saved in logs/settings.json,
# which then overrides the values here — delete that file to go back to these).
account_size = 3000        # your capital in USDT
risk_pct = 1.0             # % of capital LOST if the stop is hit (1% of 3000 = $30 per trade)
leverage = 10              # leverage you set on the exchange (use ISOLATED margin).
                           # Changes the margin locked per trade, NOT the $ at risk (that's risk_pct).
                           # Lowered per trade automatically if the stop would be too close to liquidation.
max_margin_pct = 30        # never put more than this % of capital as margin into one trade
maint_margin_pct = 0.5     # exchange maintenance margin, used to estimate the liquidation price
fee_pct = 0.05             # taker fee per side, used in backtest results

[trading]
# Auto-trading on Bybit. Keys are read from the Windows user variables BYBIT_API_KEY and
# BYBIT_API_SECRET (never put them in this file).
enabled = true             # phone: /autotrade on | off
env = "demo"               # demo (play money, real prices) | testnet | mainnet (REAL MONEY)
real_money_ok = false      # must be true before env = "mainnet" is allowed to trade
isolated = true            # put the account in isolated margin mode
trade_watchlist = false    # also auto-trade low-priority (watchlist) pairs?
max_open_trades = 3        # at most this many bot positions at once
max_same_direction = 2     # at most this many LONGs (or SHORTs) at once: BTC/ETH/SOL usually move together
max_daily_loss_pct = 3     # no NEW trades for the rest of the day once today's loss (closed trades as
                           # booked on Bybit + open trades currently losing) reaches this % of capital

[backtest]
bars = 3000                # entry-timeframe candles of history to test on

[news]
# News is used DEFENSIVELY: free feeds arrive after the price has already moved, so the bot
# doesn't trade headlines. It avoids entering into big scheduled events and sudden shocks.
enabled = true
calendar = true            # no NEW auto-trades around high-impact economic releases
countries = ["USD"]        # US data (CPI, FOMC, jobs) moves crypto the most
impact = ["High"]
pause_before_min = 15
pause_after_min = 30
heads_up_min = 30          # Telegram heads-up this long before each event
shock_guard = true         # detect sudden moves from 1m candles (faster than any free news feed)
shock_mult = 8             # 5-minute move bigger than this x the normal 1-minute range...
shock_min_pct = 1.2        # ...and at least this %  (about 1 alert/day/coin in a volatile week)
shock_pause_min = 30       # then no new entries on that coin for this long
headlines = true           # silent alerts for important headlines on your coins / macro
headline_every_sec = 180
headline_max_per_hour = 6
bybit_delistings = true    # alert if Bybit announces a delisting of one of your coins

[alerts]
telegram = true            # uses TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (environment or .env file)
log_dir = "logs"
summary_hour = 22          # daily summary at this local hour (-1 = off)
